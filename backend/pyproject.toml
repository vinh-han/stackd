[project]
name = "stackd-api"
version = "0.1.0"
description = "Stackd backend: chunking and card generation. Home of Docling ingestion."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "docling>=2.140.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# An application, not a library: run from source, no build step.
package = false

# CPU-only PyTorch for Docling: the default Linux wheel bundles CUDA (several GB) we never use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
